{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change your password</h1></div></div>
<div class="panel" style="max-width: 520px">
  {% if error %}<p class="flash flash-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="current">Current password</label>
      <input type="password" id="current" name="current" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new">New password <span class="hint">At least 8 characters</span></label>
      <input type="password" id="new" name="new" autocomplete="new-password" required minlength="8">
    </div>
    <div class="field">
      <label for="new2">Type the new password again</label>
      <input type="password" id="new2" name="new2" autocomplete="new-password" required minlength="8">
    </div>
    <button class="btn" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
